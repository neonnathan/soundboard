[package]
name = "soundboard"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
eframe = "0.37.0"
global-hotkey = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "wav", "flac", "vorbis", "ogg", "aac", "isomp4", "pcm"] }
ureq = "3.5.0"
wasapi = "0.26.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"



[build-dependencies]
winres = "0.1"

